<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <style>
        h1{
            border-style: solid;
            border-width: 4px;
            border-color: brown;
            border-radius: 20px;
            width : 200px;
            text-align: center;
                
        }
        h2{
           width: 200px;
           text-align: center;
           border-top: 4px yellow solid ;
           border-bottom: 4px brown solid;
           border-left: dotted orange 4px;
           border-right: dotted aqua 4px;
           border-radius: 10px;
        }
        
    </style>
</head>
<body>
    <h1>Abdullah</h1>
    <h2>
        Mewawala
    </h2>
</body>
</html>
