<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text and Box shadows </title>
    <style>
        #text{
            text-shadow: 8px 4px 10px black, -8px -4px 10px rgb(227, 48, 48);
        }
        #container{
            height: 200px;
            width: 200px;
            box-shadow: 5px 10px 15px black;
            background-color: aliceblue;
        }
    </style>
</head>
<body>
    <!--
    text-shadow : horizontalOffset verticalOffset blurriness color
    box-shadow : horizontalOffset verticalOffset blurriness color
    -->
    <h1 id="text">Eren Yeager</h1>
    <br>
    <div id="container">

    </div>
</body>
</html>
