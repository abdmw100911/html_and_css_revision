<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margins in css</title>
</head>
<style>
    body{
        margin: 0px;
    }
    #box1{
        border: 4px solid;
        height: 200px;
        width: 200px;
        background-color: rgb(243, 49, 49);
        font-size: 5em;
        margin-left: auto;
        
        
    }
    #box2{
        border: 4px solid;
        height: 200px;
        width: 200px;
        background-color: rgb(49, 195, 243);
        font-size: 5em;
        margin : auto;
    }
</style>
<body>
    <!--
    #margins are space around the element
    
    #margin-left : 10 px -> adds 10 px of space to the left of the element 

    #same can be done for right , top and bottom

    #margin : 50px -> applies 50px margin on all directions

    #margin-left : auto -> puts margin such that element touches the right side of the body
    -->
    <div id="box1">
        Box 1 
    </div>

    <div id="box2">
        Box2
    </div>
</body>
</html>
