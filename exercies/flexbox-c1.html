<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox challenge 1</title>
    <style>
        body{
            font-family: Arial;
        }
        .container{
            box-shadow: 0px 0px 2px rgb(113, 108, 108);
            width: 300px;
            border-radius:2px;
            padding: 5px 5px 5px 5px;
        }
        .row{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .name{
            margin-left:10px;
        }
        .count{
            margin-right:10px;
            background-color: rgb(49, 109, 245);
            color:white;
            padding: 5px 10px 5px 10px;
            border-radius: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="row">
                <div class="name">
                    Home
                </div>
                <div class="count">
                    14
                </div>
            </div>
            <div class="row">
                <div class="name">
                    Notifications
                </div>
                <div class="count">
                    3
                </div>
            </div>
            <div class="row">
                <div class="name">
                    Messages
                </div>
                <div class="count">
                    5
                </div>
            </div>
    </div>
</body>
</html>
