<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox challenge 3</title>

    <style>
        body{
            font-family: Arial;
        }
        p{
            margin-top:0px;
            margin-bottom: 0px;
        }
        .container{
            position: relative;
            top: 50px;
            left: 50px;
            width: 500px;
            box-shadow: 1px 1px 5px rgb(100, 100, 100);
        }
        .flexbox-row{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 10px 0;

        }
        .profile-pic{
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 100px;
            margin-left: 15px;
        }
        .info{
            margin-right: 250px;
        }
        .name{
            font-weight: bold;
        }
        .desc{
            color: rgb(100, 100, 100);
        }
        .popular{
            color: rgb(100, 100, 100);
            font-size: 13px;
        }
        .follow-button{
            margin-right: 20px;
            background-color: rgb(29, 155, 240);
            color: white;
            border: none;
            font-weight: bold;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="flexbox-row">
            <img src="/images/bg.png" alt="" class="profile-pic">
            <div class="info">
                <p class="name">Oliver</p>
                <p class="desc">the cat</p>
                <p class="popular">popular</p>
            </div>
            <button class="follow-button">
                Follow
            </button>
        </div>

         <div class="flexbox-row">
            <img src="/images/bg.png" alt="" class="profile-pic">
            <div class="info">
                <p class="name">Oliver</p>
                <p class="desc">the cat</p>
                <p class="popular">popular</p>
            </div>
            <button class="follow-button">
                Follow
            </button>
        </div>

         <div class="flexbox-row">
            <img src="/images/bg.png" alt="" class="profile-pic">
            <div class="info">
                <p class="name">Oliver</p>
                <p class="desc">the cat</p>
                <p class="popular">popular</p>
            </div>
            <button class="follow-button">
                Follow
            </button>
        </div>
    </div>
</body>
</html>
