<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Exercises</title>
</head>
<body>
    <!--12 a-->
    <div style="display: flex; flex-direction: row; margin-bottom: 20px;">
        <div style="background-color: lightblue; width: 200px;">
            200px
        </div>
        <div style="background-color: lightpink; width : 75px;">
            75px
        </div>
    </div>

    <!--12b-->
    <div style="display: flex; flex-direction: row; margin-bottom: 20px;">
        <div style="background-color: lightblue; width: 50px;">
            50px
        </div>
        <div style="background-color: lightpink; flex:1;">
            flex : 1 
        </div>
        <div style="background-color: lightblue; width: 75px;">
            75px
        </div>
    </div>

    <!--12c-->
    <div style="display : flex; flex-direction : row; justify-content : space-between; border: 2px gray solid; margin-bottom: 20px; ">
        <div style="background-color: lightpink;">
            item1
        </div>
        <div style="background-color: lightpink;">
            item2
        </div>
        <div style="background-color: lightpink;">
            item3
        </div>
        <div style="background-color: lightpink;">
            item4
        </div>
    </div>

    <!--12d-->
    <div style="display : flex; flex-direction:row; justify-content:space-between; border: 2px solid gray; height:50px; align-items:center;">
        <div style = "background-color: lightpink;">
            item 1 
        </div>
        <div style = "background-color: lightpink;">
            item 2
        </div>
    </div>
</body>
</html>
