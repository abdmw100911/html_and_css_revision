<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid exercise</title>
    <style>
        .container1{
            display: grid;
            grid-template-columns: 200px 75px;
            margin-bottom:20px;
        }
        .div1{
            background-color: lightblue;
        }
        .div2{
            background-color: lightpink;
        }
        
    </style>
</head>
<body>
    <!--11a-->
    <div class="container1">
        <div class="div1">200px</div>
        <div class="div2">75px</div>
    </div>

    <!--11b-->
    <div class="container2" 
    style="display: grid;
    grid-template-columns: 50px 1fr 75px;
    margin-bottom: 20px;
    "
    >
    <div class="div1">col1</div>
    <div class="div2">col2</div>
    <div class="div1">col3</div>
    </div>

    <!--11c-->
    <div class="container3" style="display: grid; 
    grid-template-columns: 1fr 1fr 1fr 1fr ;
    column-gap: 20px;
    row-gap:20px;">
        <div class="div2">col1</div>
        <div class="div2">col2</div>
        <div class="div2">col3</div>
        <div class="div2">col4</div>
        <div class="div2">col1</div>
        <div class="div2">col2</div>
        <div class="div2">col3</div>
        <div class="div2">col4</div>
    </div>
</body>
</html>
