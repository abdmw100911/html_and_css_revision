<!DOCTYPE html>
<html>
    <head>
        <title>
            Tables in HTML
        </title>
    </head>
    <body>
        <h3>Store Hours</h3>
        <table border="3" style="color: rgb(71, 200, 214); background-color: black;">
            <tr align="center">
                <th>Sunday</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
                <th>Saturday</th>
            </tr>
            <tr align="center">
                <td>Closed</td>
                <td>9-5</td>
                <td>9-5</td>
                <td>9-5</td>
                <td>9-5</td>
                <td>9-5</td>
                <td>10-2</td>
            </tr>
        </table>
    </body>
</html>
