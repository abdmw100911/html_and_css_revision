<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkedin Login page</title>
    <link rel="stylesheet" href="linkedin.css">
</head>
<body>
    <div class="container">
        <img src="linkedin.png" alt="linkedin_logo" class="logo">
        <form action="">
            <label for="firstname">First name</label>
            <input type="text" id="firstname">

            <label for="lastname">Last name</label>
            <input type="text"  id="lastname">

            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="pass">Password (6 or more characters)</label>
            <input type="password"  id="pass" minlength="6">

            <input type="submit" value="Join now">
        </form>

        <p class="or">
            or
        </p>
        <button class="continue">
            Continue with Facebook
        </button>

        <p class="already">Already on linkedin <a href="#">Sign in</a></p>
    </div>
</body>
</html>
